# GitHub Actions CI. Parked here because the gh token used to publish lacked the `workflow` scope.
# Enable: gh auth refresh -s workflow && mkdir -p .github/workflows && git mv ci/github-ci.yml .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: retain
          POSTGRES_PASSWORD: retain
          POSTGRES_DB: retain_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U retain -d retain_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m ml.train
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010
