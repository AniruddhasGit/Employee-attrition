services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: retain
      POSTGRES_PASSWORD: retain
      POSTGRES_DB: retain
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./api/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retain -d retain"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://retain:retain@db:5432/retain
      IP_HASH_SALT: ${IP_HASH_SALT:-change-me-locally}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles: ["app"]

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
