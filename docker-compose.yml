services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: retain
      POSTGRES_PASSWORD: retain
      POSTGRES_DB: retain
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./api/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retain -d retain"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
